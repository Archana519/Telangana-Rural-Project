[pytest]
# `pytest` from the repository root runs the project tests only. The Stage B snapshot under DELIVERABLES_* contains a verbatim copy of
# scripts/test_plan_network_v2.py (same module name), and the data/output folders hold no tests.
testpaths = tests scripts
norecursedirs = DELIVERABLES_DAMARAKUNTA_STAGE_B Siddipet data outputs docs paper Phase1_Report_CBIT_Format Presentation_Review .venv venv .git node_modules
addopts = -q
